# 和本地开发、cpp-data-worker 的 CI 用同一个 devshell（.nix/flake.lock），node 和 pnpm 只在那里钉版本。
# lint 和单元测试在 .github/workflows/check.yml 里跑。
image: nixos/nix:2.35.6
variables:
  NIX_CONFIG: experimental-features = nix-command flakes
build:
  script:
    - nix develop "path:$PWD/.nix" --command pnpm install --frozen-lockfile
    - nix develop "path:$PWD/.nix" --command pnpm build
    - cp dist/index.html dist/404.html
    - |
      tar c dist | curl \
        -s \
        -u "$RIPPLE_BASIC_AUTH" \
        -F "content=@-" \
        --form-string "type=tar" \
        --form-string "target=cpfs" \
        --form-string "name=$CI_PROJECT_PATH" \
        --form-string "tag=$CI_COMMIT_SHORT_SHA,$CI_COMMIT_TAG,$CI_COMMIT_REF_NAME" \
        --form-string "strip=1" \
        https://ripple.orztech.com/v0/pages.publish
